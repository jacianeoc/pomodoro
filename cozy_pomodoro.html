<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25:00 • Meu Cantinho Pomodoro 🌸</title>
  
  <!-- Fontes delicadas e arredondadas do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --card-bg: rgba(255, 250, 252, 0.72);
      --card-blur: 16px;
      --accent-primary: #f472b6; /* Rosa pastel vibrante */
      --accent-secondary: #c084fc; /* Lavanda suave */
      --accent-mint: #34d399; /* Verde menta */
      --text-main: #583548;
      --text-muted: #8b6279;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    h1, h2, .font-display {
      font-family: 'Quicksand', sans-serif;
    }

    /* Camada de fundo dinâmico (SVG ilustrado ou imagem personalizada) */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Camada sutil de brilho e partículas flutuantes */
    #bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.25), rgba(0, 0, 0, 0.08));
    }

    /* Cartão principal Glassmorphism */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 2px solid rgba(255, 255, 255, 0.75);
      box-shadow: 
        0 20px 45px -10px rgba(136, 75, 108, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
      transition: background 0.3s ease, backdrop-filter 0.3s ease, transform 0.3s ease;
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
    }

    /* Botões fofos com efeito tátil */
    .cute-btn {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cute-btn:hover {
      transform: translateY(-2px) scale(1.02);
    }
    .cute-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Animação suave de flutuação */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }
    .animate-float {
      animation: floatSlow 4.5s ease-in-out infinite;
    }

    /* Barra de progresso circular */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.5s linear, stroke 0.5s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Estilização customizada dos sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(244, 114, 182, 0.25);
      height: 8px;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f472b6;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(244, 114, 182, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Scrollbar delicada para modal */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.5);
      border-radius: 999px;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 sm:p-6 select-none">

  <!-- Fundo Dinâmico -->
  <div id="bg-canvas"></div>
  <div id="bg-overlay"></div>

  <!-- Barra Superior Discreta -->
  <header class="w-full max-w-2xl flex items-center justify-between gap-2 z-10">
    <!-- Contador de Ciclos do Dia -->
    <div class="glass-pill px-4 py-2 rounded-full flex items-center gap-2 shadow-sm">
      <span class="text-lg animate-float">🍓</span>
      <div class="text-xs sm:text-sm font-bold text-[#6d4259]">
        Ciclos hoje: <span id="cycle-count" class="text-pink-600 font-extrabold text-base">0</span>
      </div>
    </div>

    <!-- Botões de Ação Rápida (Som & Personalizar) -->
    <div class="flex items-center gap-2">
      <button id="sound-toggle-btn" title="Ativar/Silenciar alarme" class="cute-btn glass-pill p-2.5 sm:px-4 sm:py-2 rounded-full flex items-center gap-1.5 text-xs sm:text-sm font-bold text-[#6d4259] shadow-sm">
        <span id="sound-icon" class="text-base">🔔</span>
        <span class="hidden sm:inline" id="sound-label">Som Ativo</span>
      </button>

      <button id="open-settings-btn" class="cute-btn glass-pill px-4 py-2 rounded-full flex items-center gap-2 text-xs sm:text-sm font-bold text-[#6d4259] shadow-sm hover:bg-white/90">
        <span class="text-base">🎨</span>
        <span>Personalizar</span>
      </button>
    </div>
  </header>

  <!-- Cartão Central do Pomodoro -->
  <main class="w-full max-w-md my-auto py-4 z-10">
    <div id="pomodoro-card" class="glass-card rounded-[2.25rem] p-6 sm:p-8 text-center relative overflow-hidden">
      
      <!-- Detalhes decorativos fofos nos cantos -->
      <span class="absolute top-4 left-5 text-xl opacity-80 animate-float" style="animation-delay: 0.2s;">🌸</span>
      <span class="absolute top-4 right-5 text-xl opacity-80 animate-float" style="animation-delay: 1.1s;">✨</span>

      <!-- Título / Saudação Editável -->
      <div class="mb-5">
        <span id="theme-badge" class="inline-block px-3 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-pink-100/80 text-pink-600 mb-2 shadow-xs">
          🌸 Jardim Florido
        </span>
        <h1 id="greeting-text" class="text-xl sm:text-2xl font-bold text-[#583548] tracking-tight">
          Hora de florescer nos estudos ✨
        </h1>
      </div>

      <!-- Seletor de Modo (Foco / Descanso) -->
      <div class="inline-flex p-1.5 rounded-full bg-white/60 border border-white/80 shadow-inner mb-6 w-full max-w-xs">
        <button id="mode-focus-btn" class="flex-1 py-2 px-4 rounded-full text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-pink-400 to-rose-400 text-white shadow-md">
          🎀 Foco
        </button>
        <button id="mode-break-btn" class="flex-1 py-2 px-4 rounded-full text-sm font-extrabold transition-all duration-300 text-[#7c5369] hover:text-pink-600">
          🍵 Descanso
        </button>
      </div>

      <!-- Relógio Circular com Progresso -->
      <div class="relative w-56 h-56 sm:w-64 sm:h-64 mx-auto mb-6 flex items-center justify-center">
        <!-- SVG Anel de Progresso -->
        <svg class="w-full h-full drop-shadow-sm" viewBox="0 0 220 220">
          <!-- Círculo de fundo -->
          <circle
            cx="110"
            cy="110"
            r="96"
            fill="rgba(255, 255, 255, 0.45)"
            stroke="rgba(255, 255, 255, 0.85)"
            stroke-width="12"
          />
          <!-- Círculo animado -->
          <circle
            id="progress-ring"
            class="progress-ring__circle"
            cx="110"
            cy="110"
            r="96"
            fill="transparent"
            stroke="#f472b6"
            stroke-width="12"
            stroke-linecap="round"
            stroke-dasharray="603.185"
            stroke-dashoffset="0"
          />
        </svg>

        <!-- Display Digital Central -->
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="timer-display" class="font-display text-5xl sm:text-6xl font-extrabold text-[#583548] tracking-tight tabular-nums">
            25:00
          </div>
          <p id="timer-status" class="text-xs sm:text-sm font-bold text-[#8b6279] mt-1.5 flex items-center gap-1">
            Pronta para começar? 🌷
          </p>
        </div>
      </div>

      <!-- Controles Principais -->
      <div class="flex items-center justify-center gap-3 sm:gap-4">
        <button id="start-pause-btn" class="cute-btn flex-1 max-w-[180px] py-3.5 px-6 rounded-2xl font-extrabold text-base sm:text-lg text-white bg-gradient-to-r from-pink-400 via-rose-400 to-pink-500 shadow-lg shadow-pink-300/50 flex items-center justify-center gap-2">
          <span id="start-pause-icon">▶</span>
          <span id="start-pause-text">Iniciar</span>
        </button>

        <button id="reset-btn" title="Reiniciar timer" class="cute-btn p-3.5 sm:px-5 rounded-2xl font-bold text-[#7c5369] bg-white/80 hover:bg-white border border-white shadow-md flex items-center justify-center gap-1.5">
          <span class="text-lg">↺</span>
          <span class="hidden sm:inline text-sm">Reiniciar</span>
        </button>
      </div>

      <!-- Ajuste Rápido de Tempo na Tela Principal -->
      <div class="mt-6 pt-5 border-t border-white/60 flex flex-wrap items-center justify-center gap-4 text-xs sm:text-sm font-bold text-[#7c5369]">
        <div class="flex items-center gap-1.5 bg-white/50 px-3 py-1.5 rounded-full border border-white/70">
          <span>🎀 Foco:</span>
          <button onclick="adjustMinutes('focus', -5)" class="w-6 h-6 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-700 font-extrabold flex items-center justify-center">-</button>
          <span id="quick-focus-val" class="w-8 text-center text-pink-700 font-extrabold">25m</span>
          <button onclick="adjustMinutes('focus', 5)" class="w-6 h-6 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-700 font-extrabold flex items-center justify-center">+</button>
        </div>

        <div class="flex items-center gap-1.5 bg-white/50 px-3 py-1.5 rounded-full border border-white/70">
          <span>🍵 Pausa:</span>
          <button onclick="adjustMinutes('break', -1)" class="w-6 h-6 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-extrabold flex items-center justify-center">-</button>
          <span id="quick-break-val" class="w-8 text-center text-emerald-700 font-extrabold">5m</span>
          <button onclick="adjustMinutes('break', 1)" class="w-6 h-6 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-extrabold flex items-center justify-center">+</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Rodapé Delicado -->
  <footer class="w-full max-w-2xl text-center z-10 pb-1">
    <p class="inline-block glass-pill px-4 py-1.5 rounded-full text-xs font-semibold text-[#7c5369]">
      Feito com carinho para seus momentos de foco 🌸✨
    </p>
  </footer>

  <!-- =========================================================
       MODAL DE PERSONALIZAÇÃO (TEMAS, IMAGENS E TEMPOS)
       ========================================================= -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-pink-950/30 backdrop-blur-xs transition-opacity">
    <div class="glass-card bg-white/90 w-full max-w-lg rounded-[2rem] p-6 sm:p-7 max-h-[90vh] overflow-y-auto shadow-2xl border-2 border-white">
      
      <!-- Cabeçalho do Modal -->
      <div class="flex items-center justify-between pb-4 mb-5 border-b border-pink-100">
        <div class="flex items-center gap-2">
          <span class="text-2xl">🎀</span>
          <h2 class="text-xl font-extrabold text-[#583548]">Personalizar Cantinho</h2>
        </div>
        <button id="close-settings-btn" class="w-9 h-9 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-700 font-extrabold flex items-center justify-center transition">
          ✕
        </button>
      </div>

      <!-- Seção 1: Cenários Ilustrados -->
      <div class="mb-6">
        <label class="block text-sm font-extrabold text-[#583548] mb-2.5">
          🖼️ Escolha um Cenário Fofo
        </label>
        <div class="grid grid-cols-2 gap-3" id="preset-themes-grid">
          <!-- Oceano -->
          <button type="button" data-theme="ocean" class="theme-option cute-btn p-3 rounded-2xl border-2 border-transparent bg-sky-50/90 hover:bg-sky-100/90 text-left flex items-center gap-3 shadow-xs">
            <span class="text-2xl">🐚</span>
            <div>
              <div class="font-extrabold text-sm text-sky-900">Oceano Doce</div>
              <div class="text-[11px] text-sky-700">Ondas, conchas e brilho</div>
            </div>
          </button>

          <!-- Floresta -->
          <button type="button" data-theme="forest" class="theme-option cute-btn p-3 rounded-2xl border-2 border-transparent bg-emerald-50/90 hover:bg-emerald-100/90 text-left flex items-center gap-3 shadow-xs">
            <span class="text-2xl">🌿</span>
            <div>
              <div class="font-extrabold text-sm text-emerald-900">Floresta Mágica</div>
              <div class="text-[11px] text-emerald-700">Folhinhas e vagalumes</div>
            </div>
          </button>

          <!-- Jardim -->
          <button type="button" data-theme="garden" class="theme-option cute-btn p-3 rounded-2xl border-2 border-transparent bg-pink-50/90 hover:bg-pink-100/90 text-left flex items-center gap-3 shadow-xs">
            <span class="text-2xl">🌸</span>
            <div>
              <div class="font-extrabold text-sm text-pink-900">Jardim Florido</div>
              <div class="text-[11px] text-pink-700">Pétalas rosa e céu pastel</div>
            </div>
          </button>

          <!-- Stardew Valley -->
          <button type="button" data-theme="stardew" class="theme-option cute-btn p-3 rounded-2xl border-2 border-transparent bg-amber-50/90 hover:bg-amber-100/90 text-left flex items-center gap-3 shadow-xs">
            <span class="text-2xl">🌻</span>
            <div>
              <div class="font-extrabold text-sm text-amber-900">Vila Cozy</div>
              <div class="text-[11px] text-amber-700">Estilo Stardew entardecer</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Seção 2: Imagem Personalizada (Upload ou Link) -->
      <div class="mb-6 p-4 rounded-2xl bg-pink-50/70 border border-pink-100">
        <label class="block text-sm font-extrabold text-[#583548] mb-2">
          📸 Ou use sua própria imagem de fundo
        </label>
        
        <!-- Upload de arquivo local -->
        <div class="mb-3">
          <label for="bg-file-input" class="cute-btn cursor-pointer w-full py-2.5 px-4 rounded-xl bg-white border-2 border-dashed border-pink-300 hover:border-pink-400 text-pink-600 font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
            <span>📁 Escolher imagem do dispositivo</span>
          </label>
          <input type="file" id="bg-file-input" accept="image/*" class="hidden" />
        </div>

        <!-- URL de imagem externa -->
        <div class="flex gap-2">
          <input 
            type="url" 
            id="bg-url-input" 
            placeholder="Ou cole o link (URL) de uma imagem..." 
            class="flex-1 px-3.5 py-2 rounded-xl bg-white border border-pink-200 text-xs sm:text-sm text-[#583548] focus:outline-none focus:border-pink-400"
          />
          <button type="button" id="apply-url-btn" class="cute-btn px-4 py-2 rounded-xl bg-pink-400 hover:bg-pink-500 text-white font-bold text-xs sm:text-sm shadow-xs">
            Aplicar
          </button>
        </div>
        <p id="bg-feedback" class="text-[11px] text-pink-600 font-semibold mt-1.5 hidden"></p>
      </div>

      <!-- Seção 3: Tempos e Automação -->
      <div class="mb-6">
        <label class="block text-sm font-extrabold text-[#583548] mb-2.5">
          ⏱️ Configurar Tempos (minutos)
        </label>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div class="bg-white/80 p-3 rounded-2xl border border-pink-100">
            <span class="block text-xs font-bold text-[#8b6279] mb-1">Tempo de Foco 🎀</span>
            <input type="number" id="focus-minutes-input" min="1" max="180" value="25" class="w-full px-3 py-1.5 rounded-xl bg-pink-50/70 border border-pink-200 font-extrabold text-pink-700 text-base focus:outline-none focus:border-pink-400" />
          </div>
          <div class="bg-white/80 p-3 rounded-2xl border border-emerald-100">
            <span class="block text-xs font-bold text-[#8b6279] mb-1">Tempo de Descanso 🍵</span>
            <input type="number" id="break-minutes-input" min="1" max="60" value="5" class="w-full px-3 py-1.5 rounded-xl bg-emerald-50/70 border border-emerald-200 font-extrabold text-emerald-700 text-base focus:outline-none focus:border-emerald-400" />
          </div>
        </div>

        <!-- Alternância automática -->
        <label class="flex items-center justify-between p-3 rounded-2xl bg-white/80 border border-pink-100 cursor-pointer">
          <div>
            <div class="text-xs sm:text-sm font-extrabold text-[#583548]">Alternar ciclos automaticamente</div>
            <div class="text-[11px] text-[#8b6279]">Inicia o descanso assim que o foco terminar</div>
          </div>
          <input type="checkbox" id="auto-switch-toggle" class="w-5 h-5 accent-pink-500 rounded cursor-pointer" />
        </label>
      </div>

      <!-- Seção 4: Aparência do Cartão (Transparência & Desfoque) -->
      <div class="mb-6">
        <div class="flex justify-between text-xs font-extrabold text-[#583548] mb-1.5">
          <span>✨ Transparência do Cartão</span>
          <span id="opacity-val-label">72%</span>
        </div>
        <input type="range" id="card-opacity-slider" min="35" max="95" value="72" class="w-full" />
      </div>

      <!-- Botões do Rodapé do Modal -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-pink-100">
        <button type="button" id="test-sound-btn" class="cute-btn px-4 py-2.5 rounded-xl bg-purple-100 hover:bg-purple-200 text-purple-700 font-bold text-xs sm:text-sm flex items-center gap-1.5">
          <span>🎵</span> Testar Alarme
        </button>

        <div class="flex items-center gap-2">
          <button type="button" id="reset-cycles-btn" class="cute-btn px-3 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs">
            Zerar Ciclos
          </button>
          <button type="button" id="save-settings-btn" class="cute-btn px-6 py-2.5 rounded-xl bg-gradient-to-r from-pink-400 to-rose-400 text-white font-extrabold text-sm shadow-md">
            Salvar ✨
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast de Notificação Fofa -->
  <div id="cute-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-4">
    <div class="glass-pill bg-white/95 px-5 py-3 rounded-full shadow-xl border-2 border-pink-200 flex items-center gap-2.5 text-sm font-extrabold text-[#583548]">
      <span id="toast-icon" class="text-lg">🌸</span>
      <span id="toast-msg">Ciclo concluído!</span>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * CENÁRIOS ILUSTRADOS EM SVG EMBUTIDO (Data URIs leves, nítidos e sem links externos)
     * Garante funcionamento perfeito no GitHub Pages mesmo offline!
     * ============================================================================
     */

        badgeText: "#db2777",

    };

    /**
     * ============================================================================
     * ESTADO DA APLICAÇÃO & PERSISTÊNCIA NO LOCALSTORAGE
     * ============================================================================
     */
    const STORAGE_KEY = 'cozy_pomodoro_v1';

    let state = {
      focusMinutes: 25,
      breakMinutes: 5,
      mode: 'focus', // 'focus' | 'break'
      remainingSeconds: 25 * 60,
      isRunning: false,
      autoSwitch: false,
      soundEnabled: true,
      cyclesToday: 0,
      lastCycleDate: new Date().toDateString(),
      themeType: 'preset', // 'preset' | 'custom'
      presetKey: 'garden',
      customBgUrl: '',
      cardOpacity: 72
    };

    let timerInterval = null;
    const CIRCUMFERENCE = 2 * Math.PI * 96; // r = 96

    // Elementos do DOM
    const bgCanvas = document.getElementById('bg-canvas');
    const timerDisplay = document.getElementById('timer-display');
    const timerStatus = document.getElementById('timer-status');
    const progressRing = document.getElementById('progress-ring');
    const startPauseBtn = document.getElementById('start-pause-btn');
    const startPauseIcon = document.getElementById('start-pause-icon');
    const startPauseText = document.getElementById('start-pause-text');
    const resetBtn = document.getElementById('reset-btn');
    const modeFocusBtn = document.getElementById('mode-focus-btn');
    const modeBreakBtn = document.getElementById('mode-break-btn');
    const cycleCountEl = document.getElementById('cycle-count');
    const themeBadge = document.getElementById('theme-badge');
    const greetingText = document.getElementById('greeting-text');
    const quickFocusVal = document.getElementById('quick-focus-val');
    const quickBreakVal = document.getElementById('quick-break-val');

    // Modal & Controles
    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const focusMinutesInput = document.getElementById('focus-minutes-input');
    const breakMinutesInput = document.getElementById('break-minutes-input');
    const autoSwitchToggle = document.getElementById('auto-switch-toggle');
    const cardOpacitySlider = document.getElementById('card-opacity-slider');
    const opacityValLabel = document.getElementById('opacity-val-label');
    const bgFileInput = document.getElementById('bg-file-input');
    const bgUrlInput = document.getElementById('bg-url-input');
    const applyUrlBtn = document.getElementById('apply-url-btn');
    const bgFeedback = document.getElementById('bg-feedback');
    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundLabel = document.getElementById('sound-label');
    const testSoundBtn = document.getElementById('test-sound-btn');
    const resetCyclesBtn = document.getElementById('reset-cycles-btn');

    /**
     * ============================================================================
     * GERADOR DE ALARME SUAVE VIA WEB AUDIO API (Sem arquivos externos!)
     * ============================================================================
     */
    function playCozyChime(force = false) {
      if (!state.soundEnabled && !force) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        // Acorde doce de harpa/sinos (Dó maior com 9ª: C5, E5, G5, B5, D6)
        const notes = [523.25, 659.25, 783.99, 987.77, 1174.66];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);

          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.14 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 1.4);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 1.5);
        });
      } catch (e) {
        console.warn('Áudio não suportado ou bloqueado pelo navegador:', e);
      }
    }

    /**
     * ============================================================================
     * NOTIFICAÇÃO TOAST FOFA
     * ============================================================================
     */
    let toastTimeout;
    function showToast(msg, icon = '🌸') {
      const toast = document.getElementById('cute-toast');
      document.getElementById('toast-msg').textContent = msg;
      document.getElementById('toast-icon').textContent = icon;

      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 3200);
    }

    /**
     * ============================================================================
     * CARREGAR & SALVAR PREFERÊNCIAS
     * ============================================================================
     */
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
          state.isRunning = false; // Sempre inicia pausado ao abrir a página

          // Reseta contador diário se mudou o dia
          const today = new Date().toDateString();
          if (state.lastCycleDate !== today) {
            state.cyclesToday = 0;
            state.lastCycleDate = today;
          }

          state.remainingSeconds = (state.mode === 'focus' ? state.focusMinutes : state.breakMinutes) * 60;
        }
      } catch (e) {
        console.warn('Erro ao ler localStorage:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Caso a imagem base64 enviada seja muito grande para o localStorage
        console.warn('Limite de armazenamento atingido; salvando sem imagem customizada pesada.');
        const fallbackState = { ...state, customBgUrl: '' };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(fallbackState));
        } catch (_) {}
      }
    }

    /**
     * ============================================================================
     * APLICAR TEMA VISUAL & FUNDO
     * ============================================================================
     */
    function applyVisualTheme() {
      // Transparência do cartão
      const alpha = (state.cardOpacity / 100).toFixed(2);
      document.documentElement.style.setProperty('--card-bg', `rgba(255, 250, 252, ${alpha})`);
      cardOpacitySlider.value = state.cardOpacity;
      opacityValLabel.textContent = `${state.cardOpacity}%`;

      // Destaque dos botões de tema no modal
      document.querySelectorAll('.theme-option').forEach(btn => {
        const isSelected = state.themeType === 'preset' && btn.dataset.theme === state.presetKey;
        btn.classList.toggle('border-pink-400', isSelected);
        btn.classList.toggle('ring-2', isSelected);
        btn.classList.toggle('ring-pink-200', isSelected);
      });

      if (state.themeType === 'custom' && state.customBgUrl) {
        bgCanvas.style.backgroundImage = `url("${state.customBgUrl}")`;
        themeBadge.textContent = '📸 Meu Fundo Personalizado';
        themeBadge.style.backgroundColor = 'rgba(252, 231, 243, 0.88)';
        themeBadge.style.color = '#db2777';
        greetingText.textContent = 'Seu cantinho especial de foco ✨';
        progressRing.style.stroke = state.mode === 'focus' ? '#f472b6' : '#34d399';
      } else {
        const theme = ILLUSTRATED_THEMES[state.presetKey] || ILLUSTRATED_THEMES.garden;
        bgCanvas.style.backgroundImage = `url("${theme.svg}")`;
        themeBadge.textContent = theme.name;
        themeBadge.style.backgroundColor = theme.badgeBg;
        themeBadge.style.color = theme.badgeText;
        greetingText.textContent = theme.greeting;
        progressRing.style.stroke = state.mode === 'focus' ? theme.accent : '#34d399';
      }
    }

    /**
     * ============================================================================
     * ATUALIZAÇÃO DA INTERFACE DO TIMER
     * ============================================================================
     */
    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateUI() {
      const formatted = formatTime(state.remainingSeconds);
      timerDisplay.textContent = formatted;

      // Atualiza título da aba do navegador
      const modeIcon = state.mode === 'focus' ? '🎀' : '🍵';
      const modeName = state.mode === 'focus' ? 'Foco' : 'Descanso';
      document.title = `${formatted} • ${modeIcon} ${modeName}`;

      // Atualiza anel circular
      const totalDuration = (state.mode === 'focus' ? state.focusMinutes : state.breakMinutes) * 60;
      const progress = totalDuration > 0 ? state.remainingSeconds / totalDuration : 0;
      const offset = CIRCUMFERENCE * (1 - progress);
      progressRing.style.strokeDasharray = `${CIRCUMFERENCE}`;
      progressRing.style.strokeDashoffset = `${offset}`;

      // Atualiza botões de modo
      if (state.mode === 'focus') {
        modeFocusBtn.className = 'flex-1 py-2 px-4 rounded-full text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-pink-400 to-rose-400 text-white shadow-md';
        modeBreakBtn.className = 'flex-1 py-2 px-4 rounded-full text-sm font-extrabold transition-all duration-300 text-[#7c5369] hover:text-pink-600';
      } else {
        modeBreakBtn.className = 'flex-1 py-2 px-4 rounded-full text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-emerald-400 to-teal-400 text-white shadow-md';
        modeFocusBtn.className = 'flex-1 py-2 px-4 rounded-full text-sm font-extrabold transition-all duration-300 text-[#7c5369] hover:text-emerald-600';
      }

      // Botão Iniciar / Pausar
      if (state.isRunning) {
        startPauseIcon.textContent = '⏸';
        startPauseText.textContent = 'Pausar';
        timerStatus.textContent = state.mode === 'focus' ? 'Concentrada e brilhando ✨' : 'Aproveite sua pausa merecida 🍵';
      } else {
        startPauseIcon.textContent = '▶';
        startPauseText.textContent = 'Iniciar';
        timerStatus.textContent = state.mode === 'focus' ? 'Pronta para focar? 🌷' : 'Hora de relaxar um pouquinho ☁️';
      }

      // Contadores e labels
      cycleCountEl.textContent = state.cyclesToday;
      quickFocusVal.textContent = `${state.focusMinutes}m`;
      quickBreakVal.textContent = `${state.breakMinutes}m`;

      // Ícone de som
      soundIcon.textContent = state.soundEnabled ? '🔔' : '🔕';
      soundLabel.textContent = state.soundEnabled ? 'Som Ativo' : 'Silenciado';

      applyVisualTheme();
    }

    /**
     * ============================================================================
     * CONTROLE DO CRONÔMETRO
     * ============================================================================
     */
    function startTimer() {
      if (state.isRunning) return;
      state.isRunning = true;
      updateUI();

      timerInterval = setInterval(() => {
        if (state.remainingSeconds > 0) {
          state.remainingSeconds--;
          updateUI();
        } else {
          handleCycleComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      state.isRunning = false;
      clearInterval(timerInterval);
      updateUI();
    }

    function resetTimer() {
      pauseTimer();
      state.remainingSeconds = (state.mode === 'focus' ? state.focusMinutes : state.breakMinutes) * 60;
      updateUI();
    }

    function switchMode(newMode, autoStart = false) {
      pauseTimer();
      state.mode = newMode;
      state.remainingSeconds = (newMode === 'focus' ? state.focusMinutes : state.breakMinutes) * 60;
      saveState();
      updateUI();
      if (autoStart) startTimer();
    }

    function handleCycleComplete() {
      pauseTimer();
      playCozyChime();

      if (state.mode === 'focus') {
        state.cyclesToday++;
        state.lastCycleDate = new Date().toDateString();
        saveState();
        showToast('Ciclo de foco concluído! Hora do descanso 🍵', '🎉');
        switchMode('break', state.autoSwitch);
      } else {
        showToast('Descanso finalizado! Pronta para voltar? 🎀', '🌸');
        switchMode('focus', state.autoSwitch);
      }
    }

    // Ajuste rápido pelos botões + e - do cartão principal
    window.adjustMinutes = function(target, delta) {
      if (target === 'focus') {
        state.focusMinutes = Math.max(1, Math.min(180, state.focusMinutes + delta));
        if (state.mode === 'focus' && !state.isRunning) {
          state.remainingSeconds = state.focusMinutes * 60;
        }
      } else {
        state.breakMinutes = Math.max(1, Math.min(60, state.breakMinutes + delta));
        if (state.mode === 'break' && !state.isRunning) {
          state.remainingSeconds = state.breakMinutes * 60;
        }
      }
      saveState();
      updateUI();
    };

    /**
     * ============================================================================
     * EVENTOS DE INTERAÇÃO & MODAL
     * ============================================================================
     */
    startPauseBtn.addEventListener('click', () => {
      if (state.isRunning) pauseTimer();
      else startTimer();
    });

    resetBtn.addEventListener('click', () => {
      resetTimer();
      showToast('Timer reiniciado', '↺');
    });

    modeFocusBtn.addEventListener('click', () => switchMode('focus', false));
    modeBreakBtn.addEventListener('click', () => switchMode('break', false));

    soundToggleBtn.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      saveState();
      updateUI();
      if (state.soundEnabled) playCozyChime(true);
    });

    // Abrir Modal
    openSettingsBtn.addEventListener('click', () => {
      focusMinutesInput.value = state.focusMinutes;
      breakMinutesInput.value = state.breakMinutes;
      autoSwitchToggle.checked = state.autoSwitch;
      bgUrlInput.value = state.themeType === 'custom' && !state.customBgUrl.startsWith('data:') ? state.customBgUrl : '';
      bgFeedback.classList.add('hidden');
      settingsModal.classList.remove('hidden');
      settingsModal.classList.add('flex');
    });

    function closeModal() {
      settingsModal.classList.add('hidden');
      settingsModal.classList.remove('flex');
    }

    closeSettingsBtn.addEventListener('click', closeModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeModal();
    });

    // Seleção de Cenário Pré-definido
    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.addEventListener('click', () => {
        state.themeType = 'preset';
        state.presetKey = btn.dataset.theme;
        saveState();
        applyVisualTheme();
        showToast(`Cenário alterado!`, '🎨');
      });
    });

    // Upload de imagem local
    bgFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        state.themeType = 'custom';
        state.customBgUrl = event.target.result;
        saveState();
        applyVisualTheme();
        bgFeedback.textContent = '✨ Imagem carregada com sucesso!';
        bgFeedback.classList.remove('hidden');
        showToast('Fundo personalizado aplicado!', '📸');
      };
      reader.readAsDataURL(file);
    });

    // Aplicar imagem via URL
    applyUrlBtn.addEventListener('click', () => {
      const url = bgUrlInput.value.trim();
      if (!url) {
        bgFeedback.textContent = '⚠️ Cole um link válido de imagem primeiro.';
        bgFeedback.classList.remove('hidden');
        return;
      }
      state.themeType = 'custom';
      state.customBgUrl = url;
      saveState();
      applyVisualTheme();
      bgFeedback.textContent = '✨ Link de imagem aplicado!';
      bgFeedback.classList.remove('hidden');
      showToast('Fundo atualizado!', '🖼️');
    });

    // Slider de opacidade em tempo real
    cardOpacitySlider.addEventListener('input', (e) => {
      state.cardOpacity = parseInt(e.target.value, 10);
      applyVisualTheme();
    });

    // Testar alarme
    testSoundBtn.addEventListener('click', () => {
      playCozyChime(true);
      showToast('Tocando som suave...', '🎵');
    });

    // Zerar contador de ciclos
    resetCyclesBtn.addEventListener('click', () => {
      state.cyclesToday = 0;
      saveState();
      updateUI();
      showToast('Contador de ciclos zerado', '🍓');
    });

    // Salvar configurações
    saveSettingsBtn.addEventListener('click', () => {
      const newFocus = Math.max(1, Math.min(180, parseInt(focusMinutesInput.value, 10) || 25));
      const newBreak = Math.max(1, Math.min(60, parseInt(breakMinutesInput.value, 10) || 5));

      const focusChanged = newFocus !== state.focusMinutes;
      const breakChanged = newBreak !== state.breakMinutes;

      state.focusMinutes = newFocus;
      state.breakMinutes = newBreak;
      state.autoSwitch = autoSwitchToggle.checked;

      if (!state.isRunning) {
        if (state.mode === 'focus' && focusChanged) state.remainingSeconds = state.focusMinutes * 60;
        if (state.mode === 'break' && breakChanged) state.remainingSeconds = state.breakMinutes * 60;
      }

      saveState();
      updateUI();
      closeModal();
      showToast('Preferências salvas!', '✨');
    });

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      updateUI();
    });
  </script>
</body>
</html>
